name: Temporary v0.4 publication workflow builder

on:
  push:
    branches:
      - release/registry-v0.4.0-20260828
    paths:
      - ".github/workflows/_build-v0.4-publication-tmp.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/registry-v0.4.0-20260828
      - name: Derive governed v0.4 publication workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/publish-registry-v0.3.0.yml')
          target = Path('.github/workflows/publish-registry-v0.4.0.yml')
          text = source.read_text(encoding='utf-8')

          replacements = [
              ('v0.3.0', 'v0.4.0'),
              ('"release_sequence": 3', '"release_sequence": 4'),
              ('20eb859db153f17e24c052a13765e982d51cedbf', '488c979b37dd84d8645fd8e6c288d297375c4e5b'),
              ('763be9062a0c23031c794403dc4592f5db4389b0', '0d3bbf34ec7ab7e4833fba225aba96b829de1cec'),
              (
                  'required_scope = {"CANONICAL_MERGE", "TRUSTED_RELEASE_PUBLICATION", "PADAYON_RECONCILIATION"}',
                  'required_scope = {"CANONICAL_MERGE", "TRUSTED_RELEASE_PUBLICATION", "O7_7_JOINT_CONFORMANCE", "PADAYON_RECONCILIATION"}',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing asserted publication token: {old}')
              text = text.replace(old, new)

          validation_old = '''          python scripts/validate_machine_records.py\n          python -m unittest discover -s tests -p "test_*.py" -v\n'''
          validation_new = '''          python scripts/validate_machine_records.py\n          python scripts/validate_r7_surface.py\n          python -m unittest discover -s tests -p "test_*.py" -v\n          python scripts/r7_benchmark.py --output artifacts/r7-efficiency-benchmark-publication.json\n'''
          if text.count(validation_old) != 1:
              raise SystemExit('expected one exact source validation block')
          text = text.replace(validation_old, validation_new)

          text = text.replace(
              'Trusted adaptive monitoring and consumption-contract release built from the exact canonical Registry R1-R6 source after joint Registry-Orchestra reconciliation.',
              'Trusted R7 query and transport release built from the exact canonical Registry R7.1-R7.9 source after pre-publication Registry-Orchestra O7 compatibility validation.',
          )
          text = text.replace('## Added since v0.2.0', '## R7.7-R7.9 completion')
          old_bullets = '''- Bounded six-hour official-source monitoring with reviewed fingerprints and fail-closed source-drift evidence.\n          - Candidate-only automation for detected official-source changes; no automatic legal interpretation, obligation rewrite, merge, or trusted release.\n          - R5 JSON-first capability manifest for deterministic consumer negotiation.\n          - R6 deterministic release-delta contract for scoped downstream revalidation.\n          - Cross-repository contract compatibility with canonical Orchestra O1-O6 adaptive Registry consumption.'''
          new_bullets = '''- Read-only MCP v1 transport over the shared deterministic R7 query gateway.\n          - Digest-verified trusted-release installation and rebuildable indexed cache integration.\n          - Seven-mode R7.9 benchmark evidence with MCP/direct semantic parity, exact identity preservation, and governance/freshness checks.\n          - Measured byte benefit was not established in the canonical privacy/EVIDENCE benchmark; token efficiency is not claimed without host token telemetry.\n          - Pre-publication compatibility with canonical Orchestra O7.1-O7.6 and its frozen optional MCP consumer contract.'''
          if old_bullets not in text:
              raise SystemExit('missing asserted v0.3 release note bullets')
          text = text.replace(old_bullets, new_bullets)

          target.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-registry-v0.4.0.yml
          git commit -m "release(r7): add governed registry v0.4.0 publication workflow"
          git push origin HEAD:release/registry-v0.4.0-20260828
