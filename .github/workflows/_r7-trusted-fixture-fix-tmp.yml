name: Temporary R7 trusted fixture fix

on:
  push:
    branches:
      - fix/r7-trusted-direct-json-identity-20260828
    paths:
      - ".github/workflows/_r7-trusted-fixture-fix-tmp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r7-trusted-direct-json-identity-20260828
      - name: Bind synthetic index parity fixture to release manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_r7_query_gateway.py")
          text = path.read_text(encoding="utf-8")
          old = '''            identity = r7_query_gateway.ReleaseIdentity(\n                registry_version="0.4.0-test",\n                release_tag="registry-v0.4.0-test",\n                release_sequence=4,\n                release_manifest_sha256="b" * 64,\n            )\n'''
          new = '''            release_manifest_path = fixture / "release-manifest.json"\n            release_manifest_path.write_text(\n                json.dumps(\n                    {\n                        "canonical_repository": r7_query_gateway.REPOSITORY,\n                        "status": "TRUSTED_RELEASE",\n                        "registry_version": "0.4.0-test",\n                        "release_sequence": 4,\n                        "release_tag": "registry-v0.4.0-test",\n                    },\n                    indent=2,\n                )\n                + "\\n",\n                encoding="utf-8",\n            )\n            identity = r7_query_gateway.ReleaseIdentity(\n                registry_version="0.4.0-test",\n                release_tag="registry-v0.4.0-test",\n                release_sequence=4,\n                release_manifest_sha256=r7_query_gateway.digest(release_manifest_path.read_bytes()),\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit("expected one synthetic release identity fixture")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m unittest tests.test_r7_query_gateway tests.test_r7_trusted_release -v
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_r7_query_gateway.py
          git commit -m "test(r7): bind parity fixture to trusted release identity"
          git push origin HEAD:fix/r7-trusted-direct-json-identity-20260828
