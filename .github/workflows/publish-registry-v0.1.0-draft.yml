name: Stage Registry v0.1.0 draft release

on:
  push:
    branches:
      - release/registry-v0.1.0-publish-20260814
    paths:
      - release-publication/authorized.txt

permissions:
  actions: read
  contents: write

jobs:
  stage-draft:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 3821bcb55125b4d8864f28b6423650e6e17ac67b
      ARTIFACT_ID: "9219129440"
      ARTIFACT_OUTER_SHA256: afcfd38c48dca7a8ecf69a533787e730d645d76eccfa83e3031c4b1c017d4442
      TAG: registry-v0.1.0
      MANIFEST_SHA256: 9922ddcce77dfac0c01cac80fe6669aaffe37636826a56a4b54a8312558ee2d1
      BUNDLE_SHA256: b64889933d30a8dea27bcbbb95c952e4f053c14a4f345e1e04b27777b5025ec0
      EXPECTED_REPOSITORY: Baelfyre/Orchestra-Compliance-Registry
    steps:
      - name: Guard repository and release identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF_NAME" = "release/registry-v0.1.0-publish-20260814"

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/tmp/existing-release.json 2>/dev/null; then
            echo "Release $TAG already exists; refusing duplicate publication." >&2
            cat /tmp/existing-release.json
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/tmp/existing-tag.json 2>/dev/null; then
            echo "Tag $TAG already exists; refusing ambiguous publication." >&2
            cat /tmp/existing-tag.json
            exit 1
          fi

      - name: Download preserved revision-bound candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output candidate-artifact.zip

          printf '%s  %s\n' "$ARTIFACT_OUTER_SHA256" candidate-artifact.zip | sha256sum --check --strict
          mkdir candidate
          unzip -q candidate-artifact.zip -d candidate

      - name: Verify candidate inventory, identity, and hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("candidate")
          expected_names = {
              "orchestra-compliance-registry.zip",
              "orchestra-compliance-registry.zip.sha256",
              "release-manifest.json",
              "release-manifest.sha256",
          }
          actual_names = {p.name for p in root.iterdir() if p.is_file()}
          if actual_names != expected_names:
              raise SystemExit(f"unexpected candidate inventory: {sorted(actual_names)}")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest_sha = sha256(root / "release-manifest.json")
          bundle_sha = sha256(root / "orchestra-compliance-registry.zip")
          if manifest_sha != "9922ddcce77dfac0c01cac80fe6669aaffe37636826a56a4b54a8312558ee2d1":
              raise SystemExit(f"manifest hash mismatch: {manifest_sha}")
          if bundle_sha != "b64889933d30a8dea27bcbbb95c952e4f053c14a4f345e1e04b27777b5025ec0":
              raise SystemExit(f"bundle hash mismatch: {bundle_sha}")

          manifest = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          required = {
              "canonical_repository": "Baelfyre/Orchestra-Compliance-Registry",
              "registry_version": "0.1.0",
              "release_sequence": 1,
              "release_tag": "registry-v0.1.0",
              "status": "TRUSTED_RELEASE",
          }
          for key, expected in required.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f"manifest {key} mismatch: {manifest.get(key)!r}")
          if len(manifest.get("files", {})) != 7:
              raise SystemExit("manifest file inventory must contain exactly 7 registry files")

          expected_manifest_line = f"{manifest_sha}  release-manifest.json\n"
          expected_bundle_line = f"{bundle_sha}  orchestra-compliance-registry.zip\n"
          if (root / "release-manifest.sha256").read_text(encoding="utf-8") != expected_manifest_line:
              raise SystemExit("release-manifest.sha256 content mismatch")
          if (root / "orchestra-compliance-registry.zip.sha256").read_text(encoding="utf-8") != expected_bundle_line:
              raise SystemExit("bundle sha256 evidence content mismatch")
          PY

      - name: Stage draft GitHub Release with all reviewed assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Orchestra Compliance Registry v0.1.0

          First trusted Registry distribution candidate for Orchestra governance cross-integration.

          This release contains the bounded Philippines privacy pilot with four verified-current primary/regulator sources, six source-linked obligation families, executable freshness/review-due state, and deterministic release packaging.

          **Canonical publication target:** `3821bcb55125b4d8864f28b6423650e6e17ac67b`

          **Release identity**
          - Registry version: `0.1.0`
          - Release sequence: `1`
          - Tag: `registry-v0.1.0`
          - Release-manifest SHA-256: `9922ddcce77dfac0c01cac80fe6669aaffe37636826a56a4b54a8312558ee2d1`
          - Bundle ZIP SHA-256: `b64889933d30a8dea27bcbbb95c952e4f053c14a4f345e1e04b27777b5025ec0`

          The release is intentionally staged as a draft first so all assets are attached and independently verifiable before immutable publication.
          EOF

          gh release create "$TAG" \
            "candidate/orchestra-compliance-registry.zip" \
            "candidate/orchestra-compliance-registry.zip.sha256" \
            "candidate/release-manifest.json" \
            "candidate/release-manifest.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Orchestra Compliance Registry v0.1.0" \
            --notes-file release-notes.md \
            --draft \
            --prerelease=false

      - name: Verify staged draft and uploaded asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          if release.get("tag_name") != "registry-v0.1.0":
              raise SystemExit("release tag mismatch")
          if release.get("draft") is not True:
              raise SystemExit("release must remain draft at staging gate")
          if release.get("prerelease") is not False:
              raise SystemExit("release must not be prerelease")
          if release.get("target_commitish") != "3821bcb55125b4d8864f28b6423650e6e17ac67b":
              raise SystemExit(f"release target mismatch: {release.get('target_commitish')}")

          assets = {a["name"]: a for a in release.get("assets", [])}
          expected_names = {
              "orchestra-compliance-registry.zip",
              "orchestra-compliance-registry.zip.sha256",
              "release-manifest.json",
              "release-manifest.sha256",
          }
          if set(assets) != expected_names:
              raise SystemExit(f"release asset inventory mismatch: {sorted(assets)}")

          for name in sorted(expected_names):
              local = Path("candidate") / name
              digest = "sha256:" + hashlib.sha256(local.read_bytes()).hexdigest()
              remote_digest = assets[name].get("digest")
              if remote_digest is not None and remote_digest != digest:
                  raise SystemExit(f"asset digest mismatch for {name}: {remote_digest} != {digest}")
              if assets[name].get("state") != "uploaded":
                  raise SystemExit(f"asset {name} is not uploaded")
          print(f"DRAFT_RELEASE_ID={release['id']}")
          PY
