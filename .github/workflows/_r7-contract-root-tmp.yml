name: Temporary R7 contract-root patch

on:
  push:
    branches:
      - feat/r7-complete-mcp-trusted-release-benchmark-20260828
    paths:
      - ".github/workflows/_r7-contract-root-tmp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r7-complete-mcp-trusted-release-benchmark-20260828
      - name: Separate Registry data root from query contract root
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/r7_query_gateway.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "    def __init__(self, root: Path = ROOT, index_path: Path | None = None, release_identity: ReleaseIdentity | None = None):\n",
                  "    def __init__(\n        self,\n        root: Path = ROOT,\n        index_path: Path | None = None,\n        release_identity: ReleaseIdentity | None = None,\n        contract_root: Path | None = None,\n    ):\n",
              ),
              (
                  "        self.root = root\n        self.registry = load_typed_registry(root)\n",
                  "        self.root = root.resolve()\n        self.contract_root = (contract_root or ROOT).resolve()\n        self.registry = load_typed_registry(self.root)\n",
              ),
              (
                  "            verify_index(index_path, release_identity, root)\n",
                  "            verify_index(index_path, release_identity, self.root)\n",
              ),
              (
                  "                validate_r7_receipt(response[\"receipt\"], self.root)\n",
                  "                validate_r7_receipt(response[\"receipt\"], self.contract_root)\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence, found {count}: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/r7_query_gateway.py
          git commit -m "fix(r7): separate installed data from contract schema root"
          git push origin HEAD:feat/r7-complete-mcp-trusted-release-benchmark-20260828
