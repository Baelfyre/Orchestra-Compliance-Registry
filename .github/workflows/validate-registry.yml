name: Registry Validation

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Validate JSON-first machine records
        run: python scripts/validate_machine_records.py
      - name: Run registry regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build deterministic release candidate
        run: |
          rm -rf artifacts/release-candidate
          python scripts/build_release.py \
            --output-dir artifacts/release-candidate \
            --registry-version 0.1.0 \
            --release-sequence 1 \
            --release-tag registry-v0.1.0
          cat artifacts/release-candidate/release-manifest.sha256
          cat artifacts/release-candidate/orchestra-compliance-registry.zip.sha256
      - name: Preserve release candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: registry-v0.1.0-candidate
          path: artifacts/release-candidate/
          if-no-files-found: error
          retention-days: 14
