name: Publish Registry v0.1.0 immutable release

on:
  push:
    branches:
      - release/registry-v0.1.0-publish-20260814
    paths:
      - release-publication/immutability-enabled.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_ID: "370610859"
      TARGET_SHA: 3821bcb55125b4d8864f28b6423650e6e17ac67b
      TAG: registry-v0.1.0
      EXPECTED_REPOSITORY: Baelfyre/Orchestra-Compliance-Registry
      BUNDLE_DIGEST: sha256:b64889933d30a8dea27bcbbb95c952e4f053c14a4f345e1e04b27777b5025ec0
      BUNDLE_SHA_FILE_DIGEST: sha256:7aa1030a357d1514bb333b064b77e3fc68e93f85d8885b33bf6bc85a89d89ac2
      MANIFEST_DIGEST: sha256:9922ddcce77dfac0c01cac80fe6669aaffe37636826a56a4b54a8312558ee2d1
      MANIFEST_SHA_FILE_DIGEST: sha256:938696ead67476f39eecaf8cef332e30816b6089b64dbf4a8ff3f22d9f663a1e
    steps:
      - name: Verify exact staged draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > draft.json
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("draft.json").read_text(encoding="utf-8"))
          if r.get("id") != 370610859:
              raise SystemExit("unexpected draft release id")
          if r.get("tag_name") != "registry-v0.1.0":
              raise SystemExit("unexpected draft tag")
          if r.get("target_commitish") != "3821bcb55125b4d8864f28b6423650e6e17ac67b":
              raise SystemExit("unexpected draft target")
          if r.get("draft") is not True or r.get("prerelease") is not False:
              raise SystemExit("release is not the expected non-prerelease draft")
          if r.get("published_at") is not None:
              raise SystemExit("draft was already published")

          expected = {
              "orchestra-compliance-registry.zip": "sha256:b64889933d30a8dea27bcbbb95c952e4f053c14a4f345e1e04b27777b5025ec0",
              "orchestra-compliance-registry.zip.sha256": "sha256:7aa1030a357d1514bb333b064b77e3fc68e93f85d8885b33bf6bc85a89d89ac2",
              "release-manifest.json": "sha256:9922ddcce77dfac0c01cac80fe6669aaffe37636826a56a4b54a8312558ee2d1",
              "release-manifest.sha256": "sha256:938696ead67476f39eecaf8cef332e30816b6089b64dbf4a8ff3f22d9f663a1e",
          }
          assets = {a["name"]: a for a in r.get("assets", [])}
          if set(assets) != set(expected):
              raise SystemExit(f"unexpected draft asset inventory: {sorted(assets)}")
          for name, digest in expected.items():
              asset = assets[name]
              if asset.get("state") != "uploaded":
                  raise SystemExit(f"asset not uploaded: {name}")
              if asset.get("digest") != digest:
                  raise SystemExit(f"asset digest mismatch: {name}")
          PY

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/tmp/tag-before.json 2>/dev/null; then
            echo "Tag unexpectedly exists before draft publication." >&2
            cat /tmp/tag-before.json
            exit 1
          fi

      - name: Publish staged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > publish.json
          import json
          print(json.dumps({"draft": False, "prerelease": False, "make_latest": "false"}))
          PY
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input publish.json > published.json

      - name: Verify immutable published release, tag, and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > final.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          target = "3821bcb55125b4d8864f28b6423650e6e17ac67b"
          r = json.loads(Path("final.json").read_text(encoding="utf-8"))
          if r.get("draft") is not False:
              raise SystemExit("release is still draft")
          if r.get("prerelease") is not False:
              raise SystemExit("release became a prerelease unexpectedly")
          if r.get("published_at") is None:
              raise SystemExit("release has no publication timestamp")
          if r.get("immutable") is not True:
              raise SystemExit("FAIL_CLOSED: published release is not immutable")
          if r.get("tag_name") != "registry-v0.1.0":
              raise SystemExit("published tag mismatch")
          if r.get("target_commitish") != target:
              raise SystemExit("published target mismatch")

          expected = {
              "orchestra-compliance-registry.zip": "sha256:b64889933d30a8dea27bcbbb95c952e4f053c14a4f345e1e04b27777b5025ec0",
              "orchestra-compliance-registry.zip.sha256": "sha256:7aa1030a357d1514bb333b064b77e3fc68e93f85d8885b33bf6bc85a89d89ac2",
              "release-manifest.json": "sha256:9922ddcce77dfac0c01cac80fe6669aaffe37636826a56a4b54a8312558ee2d1",
              "release-manifest.sha256": "sha256:938696ead67476f39eecaf8cef332e30816b6089b64dbf4a8ff3f22d9f663a1e",
          }
          assets = {a["name"]: a for a in r.get("assets", [])}
          if set(assets) != set(expected):
              raise SystemExit("published release asset inventory mismatch")
          for name, digest in expected.items():
              if assets[name].get("digest") != digest or assets[name].get("state") != "uploaded":
                  raise SystemExit(f"published asset mismatch: {name}")

          ref = json.loads(Path("tag.json").read_text(encoding="utf-8"))["object"]
          if ref["type"] == "commit":
              resolved = ref["sha"]
          elif ref["type"] == "tag":
              raw = subprocess.check_output([
                  "gh", "api", f"repos/Baelfyre/Orchestra-Compliance-Registry/git/tags/{ref['sha']}"
              ], text=True)
              resolved = json.loads(raw)["object"]["sha"]
          else:
              raise SystemExit(f"unexpected tag object type: {ref['type']}")
          if resolved != target:
              raise SystemExit(f"tag target mismatch: {resolved}")

          print("IMMUTABLE_RELEASE_VERIFIED=TRUE")
          print(f"RELEASE_ID={r['id']}")
          print(f"PUBLISHED_AT={r['published_at']}")
          PY
