name: Schema Hardening Diagnostic

on:
  push:
    branches:
      - feature/protocol-schema-hardening-vnext-20260817
    paths:
      - '.github/workflows/schema-hardening-diagnostic.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/protocol-schema-hardening-vnext-20260817
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' -v > schema-hardening-diagnostic.txt 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> schema-hardening-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schema-hardening-diagnostic.txt
          git commit -m 'diag: record schema hardening unittest output'
          git push origin HEAD:refs/heads/feature/protocol-schema-hardening-vnext-20260817
