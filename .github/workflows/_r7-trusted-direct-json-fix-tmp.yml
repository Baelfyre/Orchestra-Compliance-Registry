name: Temporary R7 trusted direct JSON fix

on:
  push:
    branches:
      - fix/r7-trusted-direct-json-identity-20260828
    paths:
      - ".github/workflows/_r7-trusted-direct-json-fix-tmp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r7-trusted-direct-json-identity-20260828
      - name: Bind verified release identity to direct JSON gateway
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gateway_path = Path("scripts/r7_query_gateway.py")
          text = gateway_path.read_text(encoding="utf-8")

          marker = '''\n\nclass RegistryQueryGateway:\n'''
          helper = '''\n\ndef verify_release_root_identity(root: Path, identity: ReleaseIdentity) -> None:\n    root = root.resolve()\n    release_manifest_path = root / "release-manifest.json"\n    registry_manifest_path = root / "registry" / "manifest.json"\n    if not release_manifest_path.is_file() or not registry_manifest_path.is_file():\n        raise R7Error("trusted Registry root is missing release identity files")\n    release_manifest_raw = release_manifest_path.read_bytes()\n    if digest(release_manifest_raw) != identity.release_manifest_sha256:\n        raise R7Error("trusted Registry release manifest digest mismatch")\n    release_manifest = load_json(release_manifest_path)\n    registry_manifest = load_json(registry_manifest_path)\n    expected = {\n        "canonical_repository": REPOSITORY,\n        "registry_version": identity.registry_version,\n        "release_sequence": identity.release_sequence,\n        "release_tag": identity.release_tag,\n    }\n    for name, manifest in (("release", release_manifest), ("registry", registry_manifest)):\n        if manifest.get("status") != "TRUSTED_RELEASE":\n            raise R7Error(f"trusted {name} manifest is not TRUSTED_RELEASE")\n        for key, value in expected.items():\n            if manifest.get(key) != value:\n                raise R7Error(f"trusted {name} manifest identity mismatch for {key}")\n\n\nclass RegistryQueryGateway:\n'''
          if text.count(marker) != 1:
              raise SystemExit("expected one RegistryQueryGateway marker")
          text = text.replace(marker, helper)

          old = '''        if (index_path is None) != (release_identity is None):\n            raise R7Error("index_path and release_identity must be supplied together")\n        self.root = root.resolve()\n        self.contract_root = (contract_root or ROOT).resolve()\n        self.registry = load_typed_registry(self.root)\n        self.relationships = build_relationships(self.registry)\n        self.index_path = index_path\n        self.release_identity = release_identity\n        if index_path is not None and release_identity is not None:\n            verify_index(index_path, release_identity, self.root)\n            self.backend = "DIRECT_LOCAL_INDEXED_GATEWAY"\n        else:\n            self.backend = "DIRECT_LOCAL_JSON_QUERY"\n'''
          new = '''        if index_path is not None and release_identity is None:\n            raise R7Error("indexed gateway requires verified release_identity")\n        self.root = root.resolve()\n        self.contract_root = (contract_root or ROOT).resolve()\n        self.registry = load_typed_registry(self.root)\n        self.relationships = build_relationships(self.registry)\n        self.index_path = index_path\n        self.release_identity = release_identity\n        if release_identity is not None:\n            verify_release_root_identity(self.root, release_identity)\n        if index_path is not None:\n            verify_index(index_path, release_identity, self.root)\n            self.backend = "DIRECT_LOCAL_INDEXED_GATEWAY"\n        else:\n            self.backend = "DIRECT_LOCAL_JSON_QUERY"\n'''
          if text.count(old) != 1:
              raise SystemExit("expected one gateway constructor block")
          text = text.replace(old, new)
          gateway_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_r7_trusted_release.py")
          tests = test_path.read_text(encoding="utf-8")
          insert_before = '''    def test_tampered_checksum_fails_closed(self) -> None:\n'''
          additions = '''    def test_trusted_direct_json_query_binds_verified_release_identity(self) -> None:\n        with tempfile.TemporaryDirectory() as name:\n            temp = Path(name)\n            assets = self._build(temp)\n            installed = temp / "installed"\n            verified, root = r7_trusted_release.install_release(assets, installed)\n            gateway = r7_query_gateway.RegistryQueryGateway(root, release_identity=verified.identity)\n            result = gateway.query(\n                r7_query_gateway.QuerySpec("obligations", domain="privacy", projection="EVIDENCE")\n            )\n            self.assertEqual("DIRECT_LOCAL_JSON_QUERY", result["backend"])\n            receipt = result["receipt"]\n            self.assertEqual("TRUSTED_RELEASE_IDENTITY_VERIFIED", receipt["publication_trust"])\n            self.assertEqual("TRUSTED_RELEASE_READ_MODEL", receipt["registry_authority_realm"])\n            self.assertEqual(verified.registry_version, receipt["registry_version"])\n            self.assertEqual(verified.release_sequence, receipt["release_sequence"])\n            self.assertEqual(verified.release_tag, receipt["release_tag"])\n            self.assertEqual(verified.release_manifest_sha256, receipt["release_manifest_sha256"])\n            self.assertFalse(receipt["authority_expansion"])\n\n    def test_trusted_direct_json_identity_mismatch_fails_closed(self) -> None:\n        with tempfile.TemporaryDirectory() as name:\n            temp = Path(name)\n            assets = self._build(temp)\n            installed = temp / "installed"\n            verified, root = r7_trusted_release.install_release(assets, installed)\n            bad_identity = r7_query_gateway.ReleaseIdentity(\n                verified.registry_version,\n                verified.release_tag,\n                verified.release_sequence,\n                "0" * 64,\n            )\n            with self.assertRaises(r7_query_gateway.R7Error):\n                r7_query_gateway.RegistryQueryGateway(root, release_identity=bad_identity)\n\n'''
          if tests.count(insert_before) != 1:
              raise SystemExit("expected one trusted release test insertion point")
          tests = tests.replace(insert_before, additions + insert_before)
          test_path.write_text(tests, encoding="utf-8")
          PY
          python -m py_compile scripts/r7_query_gateway.py tests/test_r7_trusted_release.py
          python -m unittest tests.test_r7_trusted_release -v
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/r7_query_gateway.py tests/test_r7_trusted_release.py
          git commit -m "fix(r7): bind trusted identity to direct JSON gateway"
          git push origin HEAD:fix/r7-trusted-direct-json-identity-20260828
